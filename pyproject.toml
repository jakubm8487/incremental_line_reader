[project]
name = "incremental-line-reader"
version = "0.1.0"
description = "Reads a file from a given byte position and returns any lines appended after that point."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
